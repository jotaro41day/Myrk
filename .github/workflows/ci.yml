name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cc: [gcc, clang]
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run tests
        run: python3 -m unittest discover -s tests -v
      - name: Check syntax and installer
        run: |
          python3 -m compileall -q myrk benchmarks tests
          sh -n install.sh
      - name: Run examples
        run: |
          python3 -m myrk run examples/hello.myrk
          python3 -m myrk run examples/sum.myrk
          python3 -m myrk run examples/numeric.myrk
          python3 -m myrk run examples/vector.myrk
          python3 -m myrk run examples/fibonacci.myrk
          python3 -m myrk run examples/control_flow.myrk
          python3 -m myrk run examples/language_basics.myrk
          python3 -m myrk run examples/izhikevich.myrk
          python3 -m myrk run examples/if.myrk
          python3 -m myrk run examples/lif.myrk
          python3 -m myrk run examples/qif.myrk
          python3 -m myrk run examples/adex.myrk
          python3 -m myrk run examples/hh.myrk
      - name: Validate benchmark harness
        run: |
          python3 benchmarks/run.py --repeat 1 --warmup 0
          python3 -m benchmarks.lif --neurons 64 --steps 200 --repeat 1
          python3 -m benchmarks.neuron.izhikevich --sizes 17 1000 --steps 80 --repeat 1 --warmup 0
          python3 -m benchmarks.neuron.models --sizes 17 --steps 40 --repeat 1 --warmup 0 --summary
